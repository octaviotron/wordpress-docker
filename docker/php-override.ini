; ══════════════════════════════════════════════════════════════════════════
;  php-override.ini — Configuración PHP personalizada (sin rebuild de Docker)
;  Montado en: /usr/local/etc/php/conf.d/z-override.ini (solo lectura)
;
;  Al comenzar con 'z-', se carga al final y sobreescribe cualquier valor previo.
;  Para aplicar cambios en este archivo, simplemente ejecuta:
;    docker compose restart wordpress
; ══════════════════════════════════════════════════════════════════════════

; ── Límites de subida de archivos ─────────────────────────────────────────
upload_max_filesize = 64M
post_max_size       = 64M
max_file_uploads    = 20

; ── Memoria y tiempos de ejecución ────────────────────────────────────────
memory_limit         = 256M
max_execution_time   = 120
max_input_time       = 120

; ── Ajustes de OPcache recomendados para WordPress ───────────────────────
opcache.enable                  = 1
opcache.memory_consumption      = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files   = 10000
opcache.revalidate_freq         = 2
opcache.fast_shutdown           = 1

; ── Zona horaria por defecto ─────────────────────────────────────────────
date.timezone = America/Caracas
