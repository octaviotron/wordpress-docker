# ══════════════════════════════════════════════════════════════════════════
#  security-hardening.conf — Reglas de seguridad Apache para WordPress
#  Cargado automáticamente en Apache vía: a2enconf security-hardening
# ══════════════════════════════════════════════════════════════════════════

# ── 1. Bloquear ejecución de PHP en uploads (previene webshells) ──────────
<Directory /var/www/html/wp-content/uploads>
    <FilesMatch "\.php$">
        Require all denied
    </FilesMatch>
</Directory>

# ── 2. Bloquear xmlrpc.php (vector de fuerza bruta y ataques DDoS) ────────
<Files xmlrpc.php>
    Require all denied
</Files>

# ── 3. Bloquear acceso a archivos ocultos (.env, .git, etc.) ─────────────
<FilesMatch "^\.">
    Require all denied
</FilesMatch>

# ── 4. Bloquear acceso a archivos informativos y sensibles ───────────────
<FilesMatch "^(wp-config\.php|readme\.html|license\.txt|wp-config-sample\.php)$">
    Require all denied
</FilesMatch>

# ── 5. Proteger wp-includes de acceso PHP directo ─────────────────────────
<Directory /var/www/html>
    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteBase /
        RewriteRule ^wp-admin/includes/ - [F,L]
        RewriteRule !^wp-includes/ - [S=3]
        RewriteRule ^wp-includes/[^/]+\.php$ - [F,L]
        RewriteRule ^wp-includes/js/tinymce/langs/.+\.php - [F,L]
        RewriteRule ^wp-includes/theme-compat/ - [F,L]
    </IfModule>
</Directory>

# ── 6. Restricciones PHP para contexto web (no afectan WP-CLI) ────────────
<Directory /var/www/html>
    php_admin_value open_basedir "/var/www/html:/tmp"
    php_admin_value disable_functions "passthru,shell_exec,system,proc_open,popen,pcntl_exec,show_source"
</Directory>

# ── 7. Cabeceras HTTP de Seguridad ────────────────────────────────────────
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

# ── 8. Content Security Policy (CSP) Diferenciada ─────────────────────────
# CSP para Frontend público:
Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://pagead2.googlesyndication.com https://partner.googleadservices.com https://s3.tradingview.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://www.google-analytics.com https://stats.g.doubleclick.net https://s3.tradingview.com; frame-src 'self' https://www.youtube-nocookie.com https://public-player-widget.webradiosite.com; frame-ancestors 'self'; form-action 'self';"

# CSP para Panel de Administración (/wp-admin/) con soporte para vistas previas e instaladores:
<Location /wp-admin/>
    Header always unset Content-Security-Policy
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://yoast.com https://*.yoast.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https: blob:; font-src 'self' data: https:; connect-src 'self' https:; frame-src 'self' https: blob:; frame-ancestors 'self'; form-action 'self';"
</Location>
